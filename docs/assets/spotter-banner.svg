    </pattern>
    <linearGradient id="path" x2="1" y2="0">
      <stop stop-color="#99cb8b"/>
      <stop offset="1" stop-color="#dbfa98"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="36" fill="url(#background)"/>
