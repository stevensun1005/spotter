<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Spotter</title>
  <desc id="description">A workout plan, a completed set, and a teammate check-in connected in sequence.</desc>
  <defs>
