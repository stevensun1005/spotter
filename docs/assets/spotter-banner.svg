    <text x="77" y="276" fill="#dbfa98" font-size="24" font-weight="600" letter-spacing="2">PLAN · LIFT · CHECK IN</text>
    <g transform="translate(611 63)">
      <rect width="167" height="82" rx="18" fill="#203329" stroke="#5c7f6b"/>
      <rect x="16" y="17" width="34" height="34" rx="10" fill="#354d37"/>
      <path d="M24 27h18v15H24zm0 5h18m-13-7v5m8-5v5" fill="none" stroke="#dbfa98" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
