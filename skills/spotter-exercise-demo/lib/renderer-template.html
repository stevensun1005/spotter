<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:">
<title>Spotter · 动作示例渲染</title>
<style>
:root{font:16px/1.65 system-ui;color:#183629;background:#e9eee6;color-scheme:light}
main{max-width:42rem;margin:8vh auto;padding:2rem;border-radius:1.4rem;background:#fcfdf8}
h1{margin:0;font-size:clamp(1.5rem,6vw,2.4rem);line-height:1.2}
form{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:1.5rem 0}
input{max-width:100%}
button,a{padding:.55rem 1rem;border-radius:.6rem;background:#294832;color:white;font:inherit;text-decoration:none}
button{border:0;cursor:pointer}button:disabled{opacity:.6}
img{display:block;width:100%;border-radius:.8rem;margin-bottom:1rem}
[hidden]{display:none!important}
</style>
<main>
  <h1>Spotter 动作示例</h1>
  <p>选择动作配方 JSON，在当前浏览器生成循环 GIF。</p>
  <form>
    <input type="file" accept=".json,application/json" aria-label="动作配方 JSON" required>
    <button type="submit">生成 GIF</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <img alt="生成的动作示例" width="384" height="216" hidden>
  <a id="download" download="spotter-exercise-demo.gif" hidden>下载 GIF</a>
</main>
<!-- script -->
</html>
